    <rect x="64" y="457" width="440" height="54" rx="27" fill="#68439b"/>
    <text x="284" y="491" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Installierbar · Offline · Lokal gespeichert</text>
    <rect x="616" y="64" width="520" height="502" rx="28" fill="#fff" stroke="#ded5e8" stroke-width="2"/>
