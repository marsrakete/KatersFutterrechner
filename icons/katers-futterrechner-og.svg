<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Katers Futterrechner</title>
  <desc id="description">Tagesrationen aus vier Futterkategorien mit einem Budget von 300 kcal planen.</desc>
  <rect width="1200" height="630" fill="#f6f3f9"/>
  <circle cx="1155" cy="22" r="290" fill="#ede5f7"/>
  <circle cx="68" cy="636" r="145" fill="#ede5f7"/>
  <g font-family="DejaVu Sans, sans-serif">
    <rect x="64" y="64" width="80" height="80" rx="22" fill="#68439b"/>
    <path d="M84 104 86 84 100 94H109L123 84 125 104Z" fill="#f5e9dc"/>
